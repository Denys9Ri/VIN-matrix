name: Apply Landing Growth Engine package

on:
  push:
    branches:
      - agent/landing-growth-engine
    paths:
      - .github/growth-bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/landing-growth-engine
          fetch-depth: 0

      - name: Rebuild and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/growth-bootstrap/payload.chunk000 \
            .github/growth-bootstrap/payload.chunk001 \
            .github/growth-bootstrap/payload.chunk002 \
            .github/growth-bootstrap/payload.big000 \
            .github/growth-bootstrap/payload.big001 \
            .github/growth-bootstrap/payload.big002 \
            .github/growth-bootstrap/payload.big003 \
            .github/growth-bootstrap/payload.big004 \
            .github/growth-bootstrap/payload.big005 \
            .github/growth-bootstrap/payload.big006 \
            .github/growth-bootstrap/payload.big007 \
            .github/growth-bootstrap/payload.big008 \
            .github/growth-bootstrap/payload.big009 \
            .github/growth-bootstrap/payload.big010 \
            .github/growth-bootstrap/payload.big011 \
            .github/growth-bootstrap/payload.big012 \
            > /tmp/vin-matrix-growth.b64
          base64 --decode /tmp/vin-matrix-growth.b64 > /tmp/vin-matrix-growth.zip
          echo '226c4d187302c5b3ada976c57827dca695bfe15a92dfaa1c2dbdc778a0d8d4a1  /tmp/vin-matrix-growth.zip' | sha256sum --check --strict
          unzip -t /tmp/vin-matrix-growth.zip

      - name: Apply production package
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/vin-matrix-growth.zip -d .
          rm -rf .github/growth-bootstrap
          rm -f .github/workflows/apply-growth-package.yml

      - name: Run static preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend
          node --check frontend/scripts/sync-landing-growth-config.mjs
          node --check frontend/scripts/apply-landing-growth-seo.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('frontend/src/growth/generatedLandingConfig.json').read_text())
          print('Generated landing config is valid JSON.')
          PY

      - name: Commit final integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIN-matrix Growth Engine Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Complete Landing Growth Engine integration'
          git push origin HEAD:agent/landing-growth-engine
