name: Apply Landing Growth Engine package

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-package:
    if: github.head_ref == 'agent/landing-growth-engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-growth-engine
          fetch-depth: 0
      - name: Rebuild and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/growth-bootstrap/payload.chunk000 \
            .github/growth-bootstrap/payload.chunk001 \
            .github/growth-bootstrap/payload.chunk002 \
            .github/growth-bootstrap/payload.big000 \
            .github/growth-bootstrap/payload.big001 \
            .github/growth-bootstrap/payload.big002 \
            .github/growth-bootstrap/payload.big003 \
            .github/growth-bootstrap/payload.big004 \
            .github/growth-bootstrap/payload.big005 \
            .github/growth-bootstrap/payload.big006 \
            .github/growth-bootstrap/payload.big007.00 \
            .github/growth-bootstrap/payload.big007.01 \
            .github/growth-bootstrap/payload.big007.02 \
            .github/growth-bootstrap/payload.big007.03 \
            .github/growth-bootstrap/payload.big007.04 \
            .github/growth-bootstrap/payload.big007.05 \
            .github/growth-bootstrap/payload.big008.00 \
            .github/growth-bootstrap/payload.big008.01 \
            .github/growth-bootstrap/payload.big008.02 \
            .github/growth-bootstrap/payload.big008.03 \
            .github/growth-bootstrap/payload.big008.04 \
            .github/growth-bootstrap/payload.big008.05 \
            .github/growth-bootstrap/payload.big009 \
            .github/growth-bootstrap/payload.big010 \
            .github/growth-bootstrap/payload.big011 \
            .github/growth-bootstrap/payload.big012 \
            > /tmp/vin-matrix-growth.b64
          base64 --decode /tmp/vin-matrix-growth.b64 > /tmp/vin-matrix-growth.zip
          actual="$(sha256sum /tmp/vin-matrix-growth.zip | awk '{print $1}')"
          echo "actual_sha256=$actual"
          test "$actual" = "226c4d187302c5b3ada976c57827dca695bfe15a92dfaa1c2dbdc778a0d8d4a1"
          unzip -t /tmp/vin-matrix-growth.zip
      - name: Apply production package without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/vin-matrix-growth.zip -d .
          rm -rf .github/growth-bootstrap
          # GITHUB_TOKEN cannot safely update workflow files in this PR job.
          # Keep them unchanged here; the connected GitHub app applies those two files after this commit.
          git checkout HEAD -- .github/workflows/backend-checks.yml .github/workflows/apply-growth-package.yml
      - name: Run static preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend
          node --check frontend/scripts/sync-landing-growth-config.mjs
          node --check frontend/scripts/apply-landing-growth-seo.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('frontend/src/growth/generatedLandingConfig.json').read_text())
          print('Generated landing config is valid JSON.')
          PY
      - name: Commit application code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIN-matrix Growth Engine Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete Landing Growth Engine integration'
          git push origin HEAD:agent/landing-growth-engine
